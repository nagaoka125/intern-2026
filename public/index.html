<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>視聴画面</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/main.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>視聴画面</h1>
    </header>
    <div class="app-container">
      <section class="video-area" aria-label="動画表示領域">
        <video id="video" controls autoplay muted playsinline></video>
      </section>
      <div class="comment-panel" aria-label="コメント表示領域">
        <h2 class="comment-title">コメント</h2>
        <section class="comment-area"></section>
      </div>
      <section class="send-area" aria-label="コメント・アイテム送信領域">
        <div class="item-list" aria-label="アイテム一覧"></div>
        <div class="send-row">
          <textarea class="send-input" placeholder="コメントを入力" maxlength="200" rows="1"></textarea>
          <button type="button" class="send-button">送信</button>
        </div>
        <p class="send-error" role="alert" hidden></p>
      </section>
    </div>
  </body>
</html>
